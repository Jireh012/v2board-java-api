spring:
  application:
    name: v2board-java-api

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:v2board}?useUnicode=true&characterEncoding=utf8&useSSL=${DB_SSL:false}&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    check-template-location: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      ssl:
        enabled: ${REDIS_SSL:false}

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.v2board.api.model

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# V2Board 配置
v2board:
  show-info-to-server-enable: true  # 是否在订阅中显示信息节点（剩余流量、到期时间等）
  reset-traffic-method: 0  # 默认流量重置方式：0-每月第一天，1-到期日，2-不重置，3-每年第一天，4-每年到期日
  show-subscribe-method: 0  # 订阅方法：0-直接token，1-OTP，2-TOTP
  # 以下仅作 DB 为空时的默认值；运行时优先管理端系统配置（site / invite / ticket / email 等）
  subscribe-path: /api/v1/client/subscribe
  subscribe-url:
  show-subscribe-expire: 5  # TOTP过期时间（分钟）
  allow-new-period: 0  # 是否允许新周期：0-否，1-是
  app-name: V2Board
  # 公开配置 SM4-CBC 密钥：16 字节 UTF-8 或 32 位 hex；与前端 VITE_SM4_KEY 一致
  sm4-key: ${SM4_KEY:}
  php-config-path: ${V2BOARD_PHP_CONFIG_PATH:}
  app-url:
  invite-gen-limit: 5
  invite-commission: 10
  commission-distribution-enable: 0
  commission-distribution-l1: 100
  ticket-status: 0 # 0: 全开放, 1: 仅有付费订单用户可开, 2: 完全关闭
  withdraw-close-enable: 0
  commission-withdraw-method: alipay,wechat
  commission-withdraw-limit: 100

  redis:
    # 与 PHP 项目 REDIS_CACHE_DB 对齐的缓存库索引（默认 1）
    cache-database: ${REDIS_CACHE_DB:1}
    # 可选的 Redis Key 前缀，用于与 Laravel REDIS_PREFIX 对齐
    prefix: "v2board_database_v2board_cache:"

  # 第三方订阅源：定时拉取并用本机 sing-box 探测连通性
  external-subscribe:
    sing-box-path: ${SING_BOX_PATH:sing-box}
    probe-url: ${EXTERNAL_PROBE_URL:https://www.gstatic.com/generate_204}
    probe-timeout-ms: ${EXTERNAL_PROBE_TIMEOUT_MS:8000}
    concurrency: ${EXTERNAL_PROBE_CONCURRENCY:4}
    cron: "${EXTERNAL_SUBSCRIBE_CRON:0 */30 * * * *}"

# 应用配置
app:
  key: ${APP_KEY:base64:your-secret-key-here}  # JWT密钥，需要与PHP项目的APP_KEY保持一致

# 日志配置
logging:
  level:
    com.v2board.api: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

