# ACL4SSR Full NoAuto 风格（本地 GEOSITE/GEOIP，无 rule-providers）
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  # Meta：开启 respect-rules 时必须配置 proxy-server-nameserver
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw

proxies:

proxy-groups:
  # 第一项即客户端默认：须为 url-test「自动选择」，勿把「手动切换」放首位
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔯 故障转移"
      - "🚀 手动切换"
      - "🇭🇰 香港"
      - "🇨🇳 台湾"
      - "🇸🇬 狮城"
      - "🇯🇵 日本"
      - "🇺🇲 美国"
      - "🇰🇷 韩国"
      - "DIRECT"

  - name: "🚀 手动切换"
    type: select
    proxies: []

  - name: "♻️ 自动选择"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies: []

  - name: "🔯 故障转移"
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    proxies: []

  - name: "🇭🇰 香港"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "(?i)港|HK|Hong\\s*Kong"

  - name: "🇨🇳 台湾"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "(?i)台|TW|Taiwan"

  - name: "🇸🇬 狮城"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "(?i)新加坡|狮城|SG|Singapore"

  - name: "🇯🇵 日本"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "(?i)日本|JP|Japan"

  - name: "🇺🇲 美国"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "(?i)美|US|United\\s*States|America"

  - name: "🇰🇷 韩国"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "(?i)韩|KR|Korea"

  - name: "🍎 苹果服务"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", "🇭🇰 香港", "🇺🇲 美国"]

  - name: "📹 油管视频"
    type: select
    proxies: ["🚀 节点选择", "🇭🇰 香港", "🇺🇲 美国", "🇯🇵 日本", "🇸🇬 狮城"]

  - name: "🎥 奈飞视频"
    type: select
    proxies: ["🚀 节点选择", "🇭🇰 香港", "🇸🇬 狮城", "🇯🇵 日本", "🇺🇲 美国"]

  - name: "🎥 奈飞节点"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "(?i)奈飞|Netflix|NF"

  - name: "🌍 国外媒体"
    type: select
    proxies: ["🚀 节点选择", "🇭🇰 香港", "🇺🇲 美国", "🇯🇵 日本", "🇸🇬 狮城", "🇨🇳 台湾"]

  - name: "🌏 国内媒体"
    type: select
    proxies: ["DIRECT", "🚀 节点选择"]

  - name: "📲 电报消息"
    type: select
    proxies: ["🚀 节点选择", "🇭🇰 香港", "🇸🇬 狮城", "🇯🇵 日本", "🇺🇲 美国"]

  - name: "💬 Ai平台"
    type: select
    proxies: ["🚀 节点选择", "🇺🇲 美国", "🇯🇵 日本", "🇸🇬 狮城", "🇭🇰 香港"]

  - name: "📢 谷歌FCM"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", "🇭🇰 香港", "🇺🇲 美国"]

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies: ["DIRECT", "🚀 节点选择", "🇭🇰 香港", "🇺🇲 美国"]

  - name: "🎮 游戏平台"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", "🇭🇰 香港", "🇯🇵 日本", "🇺🇲 美国"]

  - name: "🎶 网易音乐"
    type: select
    proxies: ["DIRECT", "🚀 节点选择"]

  - name: "📺 巴哈姆特"
    type: select
    proxies: ["🇨🇳 台湾", "🚀 节点选择", "DIRECT"]

  - name: "📺 哔哩哔哩"
    type: select
    proxies: ["DIRECT", "🇨🇳 台湾", "🇭🇰 香港", "🚀 节点选择"]

  - name: "🎯 全球直连"
    type: select
    proxies: ["DIRECT", "🚀 节点选择"]

  - name: "🛑 广告拦截"
    type: select
    proxies: ["REJECT", "DIRECT", "🚀 节点选择"]

  - name: "🍃 应用净化"
    type: select
    proxies: ["REJECT", "DIRECT", "🚀 节点选择"]

  - name: "🐟 漏网之鱼"
    type: select
    proxies: ["🚀 节点选择", "♻️ 自动选择", "DIRECT", "🇭🇰 香港", "🇨🇳 台湾", "🇸🇬 狮城", "🇯🇵 日本", "🇺🇲 美国", "🇰🇷 韩国"]

rules:
  # GEOSITE 标签对齐 Meta 默认 Loyalsoldier geosite.dat（勿用 category-ad 等不存在的 list）
  - DOMAIN-SUFFIX,services.googleapis.cn,🚀 节点选择
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,🚀 节点选择
  - GEOSITE,category-ads-all,🛑 广告拦截
  - GEOSITE,win-spy,🍃 应用净化
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,apple-cn,🍎 苹果服务
  - GEOSITE,icloud,🍎 苹果服务
  - GEOSITE,youtube,📹 油管视频
  - GEOSITE,netflix,🎥 奈飞视频
  - GEOSITE,telegram,📲 电报消息
  - GEOSITE,openai,💬 Ai平台
  - GEOSITE,category-ai-!cn,💬 Ai平台
  - GEOSITE,google,📢 谷歌FCM
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,onedrive,Ⓜ️ 微软服务
  - GEOSITE,steam,🎮 游戏平台
  - GEOSITE,category-games,🎮 游戏平台
  - GEOSITE,netease,🎶 网易音乐
  - GEOSITE,bahamut,📺 巴哈姆特
  - GEOSITE,bilibili,📺 哔哩哔哩
  - GEOSITE,disney,🌍 国外媒体
  - GEOSITE,hbo,🌍 国外媒体
  - GEOSITE,primevideo,🌍 国外媒体
  - GEOSITE,spotify,🌍 国外媒体
  - GEOSITE,iqiyi,🌏 国内媒体
  - GEOSITE,youku,🌏 国内媒体
  - GEOSITE,tencent,🌏 国内媒体
  - GEOSITE,geolocation-cn,🎯 全球直连
  - GEOSITE,cn,🎯 全球直连
  - GEOSITE,gfw,🚀 节点选择
  - GEOSITE,geolocation-!cn,🚀 节点选择
  - GEOIP,telegram,📲 电报消息,no-resolve
  - GEOIP,CN,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve
  - MATCH,🐟 漏网之鱼
