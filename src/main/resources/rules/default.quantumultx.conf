# Quantumult X ACL4SSR-style local profile (no remote filter URL / GitHub rule URL)
# Placeholders: $proxies, $proxy_group, $proxy_group_{hk,tw,sg,jp,us,kr,nf}, $subs_domain

[general]
server_check_url=https://www.gstatic.com/generate_204
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymap.com, *.cake.govee.com, idsecurity.samsungcloudsecurity.com, tip.dongiqiao.cn, bitly.com
excluded_routes=10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15
icmp_auto_reply=true

[dns]
server=223.5.5.5
server=114.114.114.114
server=8.8.8.8
server=1.1.1.1

[policy]
static=🚀 节点选择, 🚀 手动切换, ♻️ 自动选择, 🇭🇰 香港, 🇨🇳 台湾, 🇸🇬 狮城, 🇯🇵 日本, 🇺🇲 美国, 🇰🇷 韩国, direct
static=🚀 手动切换, $proxy_group
url-latency-benchmark=♻️ 自动选择, $proxy_group, check-interval=600, tolerance=0
static=🇭🇰 香港, $proxy_group_hk
static=🇨🇳 台湾, $proxy_group_tw
static=🇸🇬 狮城, $proxy_group_sg
static=🇯🇵 日本, $proxy_group_jp
static=🇺🇲 美国, $proxy_group_us
static=🇰🇷 韩国, $proxy_group_kr
static=🍎 苹果服务, 🚀 节点选择, direct, 🇭🇰 香港, 🇺🇲 美国
static=📹 油管视频, 🚀 节点选择, 🇭🇰 香港, 🇺🇲 美国, 🇯🇵 日本, 🇸🇬 狮城
static=🎥 奈飞视频, 🚀 节点选择, 🇭🇰 香港, 🇸🇬 狮城, 🇯🇵 日本, 🇺🇲 美国
static=🌍 国外媒体, 🚀 节点选择, 🇭🇰 香港, 🇺🇲 美国, 🇯🇵 日本, 🇸🇬 狮城, 🇨🇳 台湾
static=🌏 国内媒体, direct, 🚀 节点选择
static=📲 电报消息, 🚀 节点选择, 🇭🇰 香港, 🇸🇬 狮城, 🇯🇵 日本, 🇺🇲 美国
static=💬 Ai平台, 🚀 节点选择, 🇺🇲 美国, 🇯🇵 日本, 🇸🇬 狮城, 🇭🇰 香港
static=Ⓜ️ 微软服务, direct, 🚀 节点选择, 🇭🇰 香港, 🇺🇲 美国
static=🛑 广告拦截, reject, direct, 🚀 节点选择
static=🎯 全球直连, direct, 🚀 节点选择
static=🐟 漏网之鱼, 🚀 节点选择, ♻️ 自动选择, direct, 🇭🇰 香港, 🇨🇳 台湾, 🇸🇬 狮城, 🇯🇵 日本, 🇺🇲 美国, 🇰🇷 韩国

[server_local]
$proxies

