# ACL4SSR Simple：广告 + CN 直连 + GFW/非 CN 代理（本地 GEOSITE，无 rule-providers）
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw

proxies:

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "DIRECT"

  - name: "♻️ 自动选择"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies: []

  - name: "🛑 广告拦截"
    type: select
    proxies: ["REJECT", "DIRECT", "🚀 节点选择"]

  - name: "🎯 全球直连"
    type: select
    proxies: ["DIRECT", "🚀 节点选择"]

  - name: "🐟 漏网之鱼"
    type: select
    proxies: ["🚀 节点选择", "♻️ 自动选择", "DIRECT"]

rules:
  - GEOSITE,category-ads-all,🛑 广告拦截
  - GEOSITE,geolocation-cn,🎯 全球直连
  - GEOSITE,cn,🎯 全球直连
  - GEOSITE,gfw,🚀 节点选择
  - GEOSITE,geolocation-!cn,🚀 节点选择
  - GEOIP,CN,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve
  - MATCH,🐟 漏网之鱼
